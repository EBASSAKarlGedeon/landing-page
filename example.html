<div class="filtered-welcome-chats-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Filtered Welcome Chats</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div>
                <input id="fwc_enabled" type="checkbox" />
                <label for="fwc_enabled">Hide chats of tag-filtered characters</label>
            </div>
            <div>
                <input id="fwc_apply_button" class="menu_button" type="submit" value="Re-apply Now" />
            </div>
            <p><small>
                Chats on the welcome screen are hidden when their character or group
                is excluded by your active tag filter in character management.
            </small></p>
        </div>
    </div>
</div>
