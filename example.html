<div class="landing-page-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Landing Page</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div>
                <input id="landing_page_enabled" type="checkbox" />
                <label for="landing_page_enabled">Enable landing page</label>
            </div>
            <p><small>Customize the look (themes, colors, background, card style, layout, custom CSS) from the ⚙ gear button on the landing page itself. Ctrl+L toggles the landing page.</small></p>
        </div>
    </div>
</div>
